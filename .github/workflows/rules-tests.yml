# Runs the rules + admin API tests (npm run test:rules) on GitHub's machines,
# so nobody has to install Java to check the rules. Results show as a tick or cross
# on each commit and pull request (GitHub > Actions tab for the details).
# The tests use local emulators with a demo project, so they need no keys and never touch real data.
name: Rules tests

on:
  push:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'api/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rules-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # the Firestore emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run test:rules
