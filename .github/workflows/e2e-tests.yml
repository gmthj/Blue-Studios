# Runs the end-to-end tests (npm run test:e2e) on GitHub's machines: Playwright uses the whole app in Chromium,
# against local Firebase emulators with a demo project, so it needs no keys and never touches real data.
# Results show as a tick or cross on each pull request. If one fails, download "playwright-report" from the run's
# page (GitHub > Actions) and open index.html: it has a screenshot and a step-by-step trace of each failed test.
name: End-to-end tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # the Firestore emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
