<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100">
  <!-- Sunglasses. The two lens centres are at x=75 and x=225 (half the width apart),
       and the picture's centre (150, 50) sits between the eyes. -->
