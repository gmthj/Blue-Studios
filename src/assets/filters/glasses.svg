    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f3b" stop-opacity="0.92" />
      <stop offset="1" stop-color="#3a4a8c" stop-opacity="0.85" />
    </linearGradient>
  </defs>
  <path d="M120 44 Q150 30 180 44" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" />
  <rect x="22" y="18" width="106" height="66" rx="26" fill="url(#lens)" stroke="#111" stroke-width="8" />
  <rect x="172" y="18" width="106" height="66" rx="26" fill="url(#lens)" stroke="#111" stroke-width="8" />
  <path d="M40 34 Q55 26 72 28" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" />
  <path d="M190 34 Q205 26 222 28" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" />
  <path d="M22 40 L4 36" stroke="#111" stroke-width="8" stroke-linecap="round" />
  <path d="M278 40 L296 36" stroke="#111" stroke-width="8" stroke-linecap="round" />
</svg>
