  <use href="#flower" transform="translate(120 46) scale(1.25)" fill="#F7A1D0" />
  <use href="#flower" transform="translate(180 46) scale(1.25)" fill="#FFFFFF" />
  <use href="#flower" transform="translate(230 58) scale(1.15)" fill="#FFB3C7" />
  <use href="#flower" transform="translate(276 80)" fill="#C9B6FF" />
  <g fill="#F5B81C">
