    <circle cx="70" cy="58" r="7" />
    <circle cx="120" cy="46" r="8" />
    <circle cx="180" cy="46" r="8" />
    <circle cx="230" cy="58" r="7" />
    <circle cx="276" cy="80" r="6" />
