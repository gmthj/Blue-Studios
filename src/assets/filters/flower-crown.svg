      <circle cx="11.4" cy="-3.7" r="11" />
      <circle cx="7" cy="9.7" r="11" />
      <circle cx="-7" cy="9.7" r="11" />
      <circle cx="-11.4" cy="-3.7" r="11" />
    </g>
    <path id="leaf" d="M0 0 C8 -10 22 -10 30 0 C22 10 8 10 0 0 Z" fill="#5DAA5A" stroke="#3E7D3C" stroke-width="2" />
  </defs>
  <path d="M8 86 Q150 30 292 86" fill="none" stroke="#6B8E4E" stroke-width="6" stroke-linecap="round" />
  <use href="#leaf" transform="translate(30 66) rotate(-150)" />
  <use href="#leaf" transform="translate(96 46) rotate(-30)" />
  <use href="#leaf" transform="translate(150 40) rotate(200)" />
  <use href="#leaf" transform="translate(204 46) rotate(-20)" />
  <use href="#leaf" transform="translate(270 66) rotate(-30)" />
  <use href="#flower" transform="translate(24 80)" fill="#FFB3C7" />
