<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Two tall bunny ears leaning outwards. Their bottoms (around y=220) sit on top of the head. -->
  <g id="ear" transform="rotate(-16 80 130)">
    <ellipse cx="80" cy="124" rx="36" ry="100" fill="#FFFFFF" stroke="#D9CCD6" stroke-width="5" />
    <ellipse cx="80" cy="122" rx="18" ry="76" fill="#F7B6C8" />
  </g>
  <use href="#ear" transform="translate(240 0) scale(-1 1)" />
</svg>
