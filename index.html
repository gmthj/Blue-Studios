<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Studios Photobooth</title>
    <!-- Curated Photostrip Font Library (Handwritten, Y2K/Retro, Clean Editorial) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Plus+Jakarta+Sans:wght@400..800&family=Bungee&family=Caveat:wght@400..700&family=Fredoka:wght@400..700&family=Indie+Flower&family=Inter:wght@400..800&family=Montserrat:ital,wght@0,400..900;1,400..900&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playpen+Sans:wght@400..800&family=Righteous&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>


    <!-- Splash screen: shown while the app loads and signs in (see main.js) -->
    <div id="splash" aria-label="Loading Blue Studios" role="status">
      <div class="splash-strip" aria-hidden="true">
        <span class="splash-frame"></span>
        <span class="splash-frame"></span>
        <span class="splash-frame"></span>
      </div>
      <p class="splash-name">Blue Studios</p>
    </div>



    <script type="module" src="/src/main.js"></script>
  </body>

  <!--
    Splash screen styles. They are here (not in a .vue file) so the splash shows straight away,
    before any JavaScript has loaded. main.js fades it out once the app is on screen.
  -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Everything in the splash is sized in em, so it all grows with this one font size:
         3.5% of the shorter side of the screen (vmin), never smaller than 16px or bigger than 36px */
      font-size: clamp(16px, 3.5vmin, 36px);
      gap: 1.125em;
      background: #ffffff;
      transition: opacity 1000ms ease;
    }

    #splash.splash-hide {
      opacity: 0;
      pointer-events: none;
    }

    /* A tiny photostrip: 3 frames that flash one after another, like a photobooth taking shots */
    .splash-strip {
      display: flex;
      flex-direction: column;
      gap: 0.25em;
      padding: 0.375em 0.375em 0.875em;
      border: 0.1875em solid #2F5BEA;
      border-radius: 0.375em;
      background: #FBF6EC;
      transform: rotate(4deg);
    }

    .splash-frame {
      width: 2.125em;
      height: 1.5625em;
      border-radius: 0.125em;
      background: #D9E1FF;
      animation: splash-flash 1.2s infinite;
    }

    .splash-frame:nth-child(2) {
      animation-delay: 200ms;
    }

    .splash-frame:nth-child(3) {
      animation-delay: 400ms;
    }

    @keyframes splash-flash {
      0%, 60%, 100% {
        background: #D9E1FF;
      }
      20% {
        background: #2F5BEA;
      }
    }

    .splash-name {
      margin: 0;
      color: #14172B;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
      font-size: 1.1em;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    /* Reduced motion: no flashing frames, and no fade */
    @media (prefers-reduced-motion: reduce) {
      .splash-frame {
        animation: none;
      }

      #splash {
        transition: none;
      }
    }
  </style>
</html>
